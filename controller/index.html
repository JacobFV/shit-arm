<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shit-arm webcam</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="workspace">
      <header>
        <div>
          <h2>Webcam View</h2>
          <p>Live camera feed with tracking overlay.</p>
        </div>
        <div id="connectionStatus" class="connection-status">connecting...</div>
      </header>
      <div class="viewport">
        <video id="webcam" autoplay muted playsinline></video>
        <canvas id="canvas" width="960" height="640"></canvas>
        <div id="webcamStatus" class="webcam-status">starting camera...</div>
      </div>
    </main>

    <script src="renderer.js"></script>
  </body>
</html>
