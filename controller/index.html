<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shit-arm controller</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="workspace">
      <header>
        <div>
          <h2>shit-arm controller</h2>
          <p>Live camera feed with tracking overlay and arm simulation.</p>
        </div>
        <div class="header-controls">
          <div class="tabs" role="tablist" aria-label="Controller views">
            <button id="workspaceTab" class="tab active" type="button" role="tab" aria-selected="true" data-view="workspace">Workspace</button>
            <button id="simTab" class="tab" type="button" role="tab" aria-selected="false" data-view="simulation">Simulation</button>
          </div>
          <div id="connectionStatus" class="connection-status">connecting...</div>
        </div>
      </header>

      <div id="workspaceView" class="viewport view active">
        <video id="webcam" autoplay muted playsinline></video>
        <canvas id="canvas" width="960" height="640"></canvas>
        <div id="webcamStatus" class="webcam-status">starting camera...</div>
      </div>

      <div id="simulationView" class="simulation-view view">
        <div class="arm-sim">
          <canvas id="armCanvas" width="960" height="640"></canvas>
        </div>
        <aside class="proprio-panel">
          <section>
            <h2>Proprioception</h2>
            <dl id="proprioKv" class="kv compact"></dl>
          </section>
          <section>
            <h2>Joints</h2>
            <div id="jointBars" class="joint-bars"></div>
          </section>
        </aside>
      </div>
    </main>

    <script src="renderer.js"></script>
  </body>
</html>
