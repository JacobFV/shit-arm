[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shit-arm"
version = "0.1.0"
description = "Control shell for guide-arm, robot-arm, and laptop-camera trash sorting experiments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["lerobot"]

[project.optional-dependencies]
dev = ["pytest>=8"]
ws = ["fastapi>=0.115", "uvicorn[standard]>=0.34"]

[project.scripts]
shit-arm = "shit_arm.cli:main"

[tool.setuptools.packages.find]
include = ["shit_arm*"]
