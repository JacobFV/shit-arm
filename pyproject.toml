[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shit-arm"
version = "0.1.0"
description = "Control shell for guide-arm, robot-arm, and laptop-camera trash sorting experiments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "feetech-servo-sdk>=1.0.0",
    "lerobot",
    "numpy>=2",
    "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
ws = ["fastapi>=0.115", "numpy>=2", "uvicorn[standard]>=0.34"]
bridge = ["numpy>=2", "opencv-contrib-python>=4.10", "pillow>=10", "pyserial>=3.5"]

[project.scripts]
shit-arm = "shit_arm.cli:main"
shit-arm-bridge = "shit_arm.data.bridge_tool:main"

[tool.setuptools.packages.find]
include = ["shit_arm*"]

[tool.setuptools.package-data]
shit_arm = ["assets/urdf/*.urdf", "assets/urdf/assets/*.stl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
